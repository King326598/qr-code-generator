<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Free Online Tool</title>
    <meta name="description" content="Generate QR codes for free from any web link. Create, download, and share QR codes instantly. Perfect for businesses and personal use.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>QR Code Generator</h1>
            <p>Generate QR codes for free from any web link</p>
        </div>
    </header>

    <main>
        <div class="container">
            <!-- Google AdSense Banner Ad (728x90) -->
            <div class="ad-banner">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                     data-ad-slot="XXXXXXXXXX"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>

            <div class="generator-section">
                <div class="input-section">
                    <h2>Enter URL to Generate QR Code</h2>
                    <div class="input-group">
                        <input type="url" id="urlInput" placeholder="https://example.com" required>
                        <button id="generateBtn">Generate QR Code</button>
                    </div>
                    <div class="error-message" id="errorMessage"></div>
                </div>

                <div class="output-section">
                    <div class="qr-controls">
                        <select id="qrSize">
                            <option value="200">Small (200px)</option>
                            <option value="300" selected>Medium (300px)</option>
                            <option value="400">Large (400px)</option>
                        </select>
                        <button id="downloadBtn" disabled>Download PNG</button>
                        <button id="copyBtn" disabled>Copy QR Code</button>
                    </div>

                    <div class="qr-container">
                        <div id="qrPlaceholder">
                            <p>Your QR code will appear here</p>
                            <div class="placeholder-icon">📱</div>
                        </div>
                        <canvas id="qrCanvas" style="display: none;"></canvas>
                    </div>
                </div>
            </div>

            <!-- Google AdSense Sidebar/Responsive Ad -->
            <div class="ad-sidebar">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                     data-ad-slot="XXXXXXXXXX"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 QR Code Generator. Create QR codes for free.</p>
            <div class="footer-links">
                <a href="#privacy">Privacy Policy</a>
                <a href="#terms">Terms of Service</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </footer>

    <!-- QR Code Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode_SJIS.min.js"></script>
    <script src="script.js"></script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</body>
</html>
